[build-system]
requires = ["setuptools>=77.0.3,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-example-gds-plugin"
version = "0.1.0"
description = "CPU-only discovery example for LMCache GDS plugins"
requires-python = ">=3.10"
dependencies = ["lmcache"]

[project.entry-points."lmcache.gds_plugins"]
example_gds = "lmcache_example_gds:Backend"

[tool.setuptools.packages.find]
where = ["src"]
